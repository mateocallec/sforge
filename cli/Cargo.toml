[package]
name = "sforge"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A curl-like HTTP client with named, reusable browser sessions, built for penetration testers juggling multiple accounts."
repository = "https://github.com/mateocallec/sforge"
readme = "README.md"
keywords = ["http", "cli", "pentest", "session", "curl"]
categories = ["command-line-utilities", "web-programming::http-client"]

[dependencies]
anyhow = "1.0.104"
brotli = "9.0.0"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
flate2 = "1.1.10"
md-5 = "0.11.0"
owo-colors = "4.4.0"
ratatui = { version = "0.30.2", default-features = false, features = ["std", "crossterm"] }
rustls = "0.23.43"
rustls-native-certs = "0.8.4"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shlex = "2.0.1"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
toml_edit = { version = "0.25.13", features = ["serde"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
