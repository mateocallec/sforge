<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SessionForge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main id="main-view">
      <header>
        <button id="settings-button" class="icon-button" type="button" aria-label="Settings">
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            ></path>
          </svg>
        </button>
        <h1>SessionForge</h1>
      </header>

      <p class="session-name" id="session-name-display"></p>

      <button id="copy-button" class="primary-button" type="button">Copy setup command</button>

      <p id="main-message" class="message" hidden></p>

      <label class="checkbox-row">
        <input type="checkbox" id="include-ua-checkbox" />
        Include User-Agent
      </label>
    </main>

    <main id="settings-view" hidden>
      <header>
        <h1>Settings</h1>
      </header>

      <label class="field">
        Session name
        <input
          type="text"
          id="session-name-input"
          placeholder="e.g. acme-admin-chrome"
          autocomplete="off"
        />
      </label>
      <p id="session-name-error" class="field-error" hidden>Enter a session name first.</p>

      <label class="field">
        Operating system
        <select id="os-select">
          <option value="auto">Auto-detect</option>
          <option value="windows">Windows</option>
          <option value="macos">macOS</option>
          <option value="linux">Linux</option>
        </select>
      </label>

      <button id="done-button" class="primary-button" type="button">Done</button>

      <p class="hint">
        Cookies are captured for the active tab's domain and its subdomains, including subdomains
        not currently open in this browser. Nothing is transmitted anywhere — the generated command
        is only copied to your clipboard.
      </p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
